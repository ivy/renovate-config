name: Check

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

# A newer push supersedes the run before it; the job only checks, so cancelling
# it loses nothing.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  hk:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@v5.2.7
        with:
          cache: false
      - run: hk check --all
