# Tools the git hooks and the Check workflow run; CI installs them through
# jdx/mise-action, verified against mise.lock.
[tools]
"aqua:koalaman/shellcheck" = "0.11.0"
"aqua:rhysd/actionlint" = "1.7.12"
hk = { version = "2.11.1", workflow = "release.yml" }
node = "26.13.1"
# @yarnpkg/libzip@3.2.2 was published without the provenance 3.2.0 had
# (https://github.com/yarnpkg/berry/issues/7182); drop the exclusion once
# Renovate depends on a release that has it again.
"npm:renovate" = { version = "44.222.5", trust_policy_excludes = ["@yarnpkg/libzip@3.2.2"] }

[settings]
lockfile = true
